; HP 29016D RTE-MH generation, adapted from the Sancho/Bryan 2020 kit.
; All select codes and addresses are octal. Track counts are decimal.
expect haltafter=100000
send delay=50000
set -n console log=generation-console.log
do hardware.ini
set tty autolf
attach -n dpc rte-2100s.img

; Load and configure 24K console SIO driver as SC 11
attach ptr rtgen/sio/29100-60017_A_24K_SIO_TTY.abs
d s 0
boot ptr

deposit S 11
deposit P 2
go

; Load and configure 24K paper tape reader SIO driver as SC 12

attach ptr rtgen/sio/29100-60019_A_24K_SIO_RDR.abs
d s 0
boot ptr

deposit S 12
deposit P 2
go

; Load and configure 24K paper tape punch SIO driver as SC 13
attach ptr rtgen/sio/29100-60020_A_24K_SIO_PUNCH.abs
d s 0
boot ptr

deposit S 13
deposit P 2
go

; load MH RTGEN

attach ptr rtgen/29014-60001_B_MH-RTGEN.abs
d s 0
boot ptr

; Run

deposit S 0
deposit P 100

; attach mh boot papertape

attach ptp -n rte-2100s-boot.abs

; initialization phase

d s 0
d p 100
go until "MH DISC CHNL?"
send "14\r"
go until "0?"
send "203,0\r"
go until "1?"
send "203,0\r"
go until "2?"
send "/E\r"
go until "SYSTEM SUBCHNL?"
send "0\r"
go until "AUX DISC (YES OR NO)?"
send "YES\r"
go until "AUX DISC SUBCHNL?"
send "1\r"
go until "SCRATCH SUBCHANL?"
send "1\r"
go until "START SCRATCH?"
send "0\r"
go until "SECTORS/TRACK?"
send "48\r"
go until "TBG CHNL?"
send "10\r"
go until "PRIV. INT. CARD ADDR?"
send "0\r"
go until "SWAPPING?"
send "YES\r"
go until "LWA MEM?"
send "77677\r"
go until "PRGM INPT?"
send "PT\r"
go until "LIBR INPT?"
send "PT\r"
go until "PRAM INPT?"
send "TY\r"
go until "PUNCH BOOT?"
send "YES\r"
go until "PUNCH BOOT?"
send "NO\r"
go

; program input phase: Now load rel files for RTE

goto start_module_load

:load_module
echo ---> Load Module %1
att ptr rtgen/%1
d s 0
cont
return

:start_module_load

; Core Resident System
call load_module 29016-RTE_CORE_EXEC.rel        ; 29016       C     RTE SYSTEM
call load_module 29016-RTE_CORE_SCHED.rel
call load_module 29016-RTE_CORE_RTIOC.rel
call load_module 29029-60001_RTE_DVR00.rel      ; 29029-60001 1543  RTE Multiple-Device System Control Driver Routine (DVR 00)
call load_module 29013-60001_RTE_DVR31.rel      ; 29013-60001 C     RTE MOVING HEAD DISC 7900 DRIVER (DVR31)

; FMP - File Management Package
call load_module 29033-A_FMP.rel

; 20874-60007 D     RTE ASSEMBLER
call load_module 20874-60001_ASMB.rel
call load_module 20874-60002_ASMBD.rel
call load_module 20874-60003_ASMB1.rel
call load_module 20874-60004_ASMB2.rel
call load_module 20874-60005_ASMB3.rel
call load_module 20874-60006_ASMB4.rel
call load_module 20874-60007_ASMB5.rel

; 20875-60001 E     RTE FORTRAN II
call load_module 20875-60001_FTN.rel
call load_module 20875-60002_FTN.rel
call load_module 20875-60003_FTN.rel
call load_module 20875-60004_FTN.rel
call load_module 20875-60005_FTN.rel

; ALGOL
call load_module 24129-60001_ALGOL.rel
call load_module 24129-60002_ALGOL.rel

; RTE RELOCATABLE LOADER
call load_module 29022-60001_LOADR.rel          ; Rev B

; RTE SXL LOADER
call load_module sxl/29103-60001_Rev-A_0103.rbin
call load_module sxl/29103-60001_Rev-A_0203.rbin
call load_module sxl/29103-60001_Rev-A_0303.rbin
call load_module sxl/29103-60060_Rev-C.rbin     ; New version of TERMF routine that patches the invalid RQ bug con closing files

; Editor
call load_module 20805-60001_EDIT.rel

; Stats - Whzat like program (in ALGOL)
call load_module stats.rel

; Libraries
call load_module 24151-01_F2E.rel               ; 24151-60001 REV D  RTE/DOS RELOCATABLE LIBRARY-F2E (EAU)
call load_module 24153-60001_FF.N.rel           ; 24153-60001 C      FF.N    RTE/DOS  FORTRAN FORMATTER

; Finish module input and print the relocation map.
d s 100001
go

; Parameter input phase

go until "PARAMETERS"
send "/E\r"
go until "BLANK ID SEGMENTS?"
send "40\r"
go until "FWA BP LINKAGE?"
send "100\r"
go until "EQUIPMENT TABLE ENTRY"
send '14,DVR31,D\r'
go until "\r\n"
send '11,DVR00,B\r'
go until "\r\n"
send '12,DVR01\r'
go until "\r\n"
send '13,DVR02\r'
go until "\r\n"
send '/E\r'
go until "1 = EQT #?"
send "2\r"
go until "2 = EQT #?"
send "1,0\r"
go until "3 = EQT #?"
send "1,1\r"
go until "4 = EQT #?"
send "4\r"
go until "5 = EQT #?"
send "3\r"
go until "6 = EQT #?"
send "2\r"
go until "7 = EQT #?"
send "0\r"
go until "8 = EQT #?"
send "0\r"
go until "9 = EQT #?"
send "/E\r"
go until "INTERRUPT TABLE"
send '11,EQT,2\r'
go until "\r\n"
send '12,EQT,3\r'
go until "\r\n"
send '13,EQT,4\r'
go until "\r\n"
send '14,EQT,1\r'
go until "\r\n"
send '15,EQT,1\r'
go until "\r\n"
send '/E\r'
go until "CHANGE BP LINKAGE?"
send "1100\r"
go until "CHANGE FWA SYS AV MEM?"
send "27000\r"
go until "BG BOUNDRY?"
send "30000\r"
go

; detach disc in case of user want to copy then or to stop here to
; continue interactively setting up the system

det dpc
det ptp

; now start RTE and initialize discs

set tty noautolf
reset

; attach again discs
att dpc rte-2100s.img

att -e ptr rte-2100s-boot.abs
d s 0
boot ptr

d s 0
;go 100

go 100 until haltafter=0,"FMGR 002\r\n"

go until ":"
send "IN,RT,-2,2,SYS,100\r"
go until ":"
send "IN,RT,-3,3,AUX,0\r\r"
go until "*"
send delay=1000000 "ON,FMGR\r"
go until ":"
send "LL,1\r"
go until ":"
send "CL\r"
go until ":"
send "DL\r"
go until ":"
; the second \r is to get the * prompt
send "EX\r\r"
go until "*"
send "ON,STATS\r"
go until "T.END"
send "\r"
go until "*"

detach all
echo GENERATION_OK
bye
