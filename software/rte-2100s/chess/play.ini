; Start a fresh simulator, reload CHESS from the filesystem and play two moves.
do hardware.ini
set cpu stop=unimpl;unsc;ioerr
expect haltafter=100000
send delay=50000
attach dpc playtest.img
attach -e ptr rte-2100s-boot.abs
boot ptr
deposit s 0
go 100 until "SET TIME"
send "\r"
go until "*"
send "ON,FMGR\r"
go until ":"
send "RP,CHESS\r"
go until ":"
send "RP,IOTST\r"
go until ":"
send "EX\r\r"
go until "*"
send "ON,CHESS\r"
go until "TYPE 1 FOR A NEW GAME"
send "1\r"
go until "CHOICE: (B=1, W=-1)"
send "-1\r"
go until "YOUR TURN: FROM SQUARE?"
send "32\r"
go until "TO SQUARE?"
send "42\r"
go until "MY MOVE FROM"
go until "YOUR TURN: FROM SQUARE?"
send "35\r"
go until "TO SQUARE?"
send "55\r"
go until "MY MOVE FROM"
go until "YOUR TURN: FROM SQUARE?"
send "0\r\r"
go until "*"
send "ON,IOTST\r"
go until "HP2100S RTE OK"
send "\r"
go until "*"
detach all
echo CHESS_PLAY_OK
bye
