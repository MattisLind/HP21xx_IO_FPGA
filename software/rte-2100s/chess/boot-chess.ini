; Interactive convenience script. Run from the generated output directory.
do hardware.ini
set cpu stop=unimpl;unsc;ioerr
expect haltafter=100000
send delay=50000
attach dpc rte-chess.img
attach -e ptr rte-2100s-boot.abs
boot ptr
deposit s 0
go 100 until "SET TIME"
send "\r"
go until "*"
send "ON,FMGR\r"
go until ":"
send "RP,CHESS\r"
go until ":"
send "EX\r\r"
go until "*"
send "ON,CHESS\r"
go
