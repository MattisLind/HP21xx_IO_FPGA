; Compile the unchanged ALGOL and assembly sources using RTE tools.
do hardware.ini
set cpu stop=unimpl;unsc;ioerr
expect haltafter=100000
send delay=50000
show devices
show cpu
attach dpc rte-chess.img
attach -e ptr rte-2100s-boot.abs
boot ptr
deposit s 0
go 100 until "SET TIME"
send "\r"
go until "*"
send "LG,20\r\r"
go until "*"

attach -e ptr source/chess.alg
attach -n ptp objects/chess0.rel
send "ON,ALGOL,99\r"
go until "$END ALGOL"
send "\r"
go until "*"

attach -e ptr source/chess1.asm
attach -n ptp objects/chess1.rel
send "ON,ASMB,99\r"
go until "$END ASMB"
send "\r"
go until "*"
attach -e ptr source/chess2.asm
attach -n ptp objects/chess2.rel
send "ON,ASMB,99\r"
go until "$END ASMB"
send "\r"
go until "*"
attach -e ptr source/chess3.asm
attach -n ptp objects/chess3.rel
send "ON,ASMB,99\r"
go until "$END ASMB"
send "\r"
go until "*"
attach -e ptr source/chess4.asm
attach -n ptp objects/chess4.rel
send "ON,ASMB,99\r"
go until "$END ASMB"
send "\r"
go until "*"
attach -e ptr source/chess5.asm
attach -n ptp objects/chess5.rel
send "ON,ASMB,99\r"
go until "$END ASMB"
send "\r"
go until "*"

send "ON,SXL,1,0,6,0\r"
go until "-"
send "RELOCATE L.G\r"
go until "-"
send "DISPLAY UNDEFS\r"
go until "-"
send "SEARCH LIBRY\r"
go until "-"
; A second scan resolves the formatter's software conversion routines.
send "SEARCH LIBRY\r"
go until "-"
send "END\r"
go until "END SXL"
send "\r"
go until "*"

send "ON,FMGR\r"
go until ":"
send "DL\r"
go until ":"
send "EX\r\r"
go until "*"
detach all
echo CHESS_BUILD_OK
bye
