; Prove that IOTST was written to disk and survives a fresh simulator.
do hardware.ini
set cpu stop=unimpl;unsc;ioerr
expect haltafter=100000
send delay=50000
attach dpc verification.img
attach -e ptr rte-2100s-boot.abs
boot ptr
deposit s 0
go 100 until "SET TIME"
send "\r"
go until "*"
send "ON,FMGR\r"
go until ":"
send "RP,IOTST\r"
go until ":"
send "EX\r\r"
go until "*"
send "ON,IOTST\r"
go until "HP2100S RTE OK"
send "\r"
go until "*"
detach all
echo REBOOT_OK
bye
