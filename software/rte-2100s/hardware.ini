; All select codes and memory addresses are octal.
set cpu 2100
set cpu 32k
set cpu nofp
set cpu noffp
set dma1 enabled
set dma2 enabled
; The 2100 model includes memory protect; it cannot be toggled separately.

set tbg sc=10
set tty sc=11
set ptr sc=12
set ptp sc=13
set dpc 13210a
set dpc sc=14
set dpc enabled

; Only the devices present in the target machine are enabled.
set baci disabled
set da disabled
set dqc disabled
set drc disabled
set ds disabled
set mpx disabled
set msc disabled
set mux disabled
set muxc disabled
set pif disabled
set lpt disabled
set lps disabled
set tty noautolf
set console del=177
