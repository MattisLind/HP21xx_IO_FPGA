; Cold boot a disposable image, assemble and link a program, write it to
; the filesystem, and execute it. No printer or optional CPU firmware.
do hardware.ini
set cpu stop=unimpl;unsc;ioerr
expect haltafter=100000
send delay=50000
show devices
show cpu
attach dpc verification.img
attach -e ptr rte-2100s-boot.abs
boot ptr
deposit s 0
go 100 until "SET TIME"
send "\r"
go until "*"

send "LG,10\r\r"
go until "*"
attach -e ptr iotest.src.txt
attach -n ptp verification-punch.abs
send "ON,ASMB,99\r"
go until "$END ASMB"
send "\r"
go until "*"

; LU 6 (listing output) stays on the serial console.
send "ON,SXL,1,0,6,0\r"
go until "-"
send "RELOCATE L.G\r"
go until "-"
send "DISPLAY UNDEFS\r"
go until "-"
send "SEARCH LIBRY\r"
go until "-"
send "END\r"
go until "END SXL"
send "\r"
go until "*"

send "ON,FMGR\r"
go until ":"
send "RP,IOTST\r"
go until ":"
send "DL\r"
go until ":"
send "EX\r\r"
go until "*"
send "ON,IOTST\r"
go until "HP2100S RTE OK"
send "\r"
go until "*"
send "ON,STATS\r"
go until "T.END"
send "\r"
go until "*"
detach all
echo VERIFY_OK
bye
